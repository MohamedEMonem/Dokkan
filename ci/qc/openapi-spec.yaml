openapi: "3.1.0"

info:
  title: Dokkan Backend API
  version: "1.0.0"
  description: |
    OpenAPI specification for the Dokkan backend REST API.
    Used by the CI/CD contract-testing suite (ci/qc/run_contract.sh) to
    verify that all documented endpoints have matching Express route handlers.
  contact:
    name: Dokkan Engineering

servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://api.dokkan.app
    description: Production

# ── Security schemes ─────────────────────────────────────────────────────────
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SuccessResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data:    { type: object }

    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
        error:   { type: string }

    User:
      type: object
      properties:
        id:        { type: string, format: uuid }
        email:     { type: string, format: email }
        name:      { type: string }
        role:      { type: string, enum: [Customer, StoreOwner, Admin] }
        createdAt: { type: string, format: date-time }

    AuthTokens:
      type: object
      properties:
        accessToken:  { type: string }
        refreshToken: { type: string }

    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:    { type: string, format: email }
        password: { type: string, minLength: 8 }
        name:     { type: string, minLength: 1 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email }
        password: { type: string }

    Product:
      type: object
      properties:
        id:          { type: string, format: uuid }
        name:        { type: string }
        description: { type: string }
        price:       { type: number, format: float }
        storeId:     { type: string, format: uuid }
        createdAt:   { type: string, format: date-time }

    Store:
      type: object
      properties:
        id:        { type: string, format: uuid }
        name:      { type: string }
        subdomain: { type: string }
        ownerId:   { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    CartItem:
      type: object
      properties:
        id:        { type: string, format: uuid }
        productId: { type: string, format: uuid }
        quantity:  { type: integer, minimum: 1 }

# ── Paths ─────────────────────────────────────────────────────────────────────
paths:

  /api/health:
    get:
      summary: Health check
      operationId: getHealth
      tags: [System]
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

  /api/auth/register:
    post:
      summary: Register a new user
      operationId: registerUser
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Email already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/auth/login:
    post:
      summary: Login and obtain JWT tokens
      operationId: loginUser
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessResponse" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthTokens" }
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/products:
    get:
      summary: List all products
      operationId: listProducts
      tags: [Products]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: storeId
          in: query
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "401":
          description: Unauthorized

  /api/products/{id}:
    get:
      summary: Get a product by ID
      operationId: getProduct
      tags: [Products]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "404":
          description: Not found

  /api/stores:
    get:
      summary: List all stores
      operationId: listStores
      tags: [Stores]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Store list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

  /api/stores/{id}:
    get:
      summary: Get a store by ID
      operationId: getStore
      tags: [Stores]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Store detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "404":
          description: Not found

  /api/cart:
    get:
      summary: Get current user cart
      operationId: getCart
      tags: [Cart]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Cart contents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "401":
          description: Unauthorized
