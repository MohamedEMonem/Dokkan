name: Deploy MVP to EC2

on:
  push:
    branches:
      - master # Or your designated release branch

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-backend

jobs:
  build-and-push-backend:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  build-frontend:
    name: Build Frontend Dist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Adjust to match your Vite config

      - name: Install and Build
        working-directory: ./Frontend
        run: |
          npm ci
          npm run build
        env:
          # Ensure your Vite app builds with the correct production API endpoint
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }} 

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./Frontend/dist/

  deploy-to-ec2:
    name: Deploy to EC2
    needs: [build-and-push-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Copy Frontend to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist/*"
          target: "/var/www/dokkan/frontend" # Ensure this matches your Nginx root
          strip_components: 1

      - name: Execute Backend Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Login to GHCR on the EC2 instance
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 2. Navigate to your app directory (assumes docker-compose.backend.yml is here)
            cd /opt/dokkan/backend
            
            # 3. Pull the latest image
            docker compose -f docker-compose.backend.yml pull backend
            
            # 4. Restart the backend service (startup.sh handles Prisma migrations)
            docker compose -f docker-compose.backend.yml up -d --no-deps backend
            
            # 5. Clean up old dangling images to save EC2 disk space
            docker image prune -f