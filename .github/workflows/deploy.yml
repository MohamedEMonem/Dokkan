name: Deploy

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Docker requires lowercase repository names
  GHCR_REPOSITORY_BACKEND: ghcr.io/abdelrahmanmnaser/dokkan-backend
  GHCR_REPOSITORY_FRONTEND: ghcr.io/abdelrahmanmnaser/dokkan-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_REPOSITORY_BACKEND }}:${{ github.sha }}
            ${{ env.GHCR_REPOSITORY_BACKEND }}:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: true
          build-args: |
            VITE_SERVER_API_URL=${{ secrets.VITE_SERVER_API_URL }}
          tags: |
            ${{ env.GHCR_REPOSITORY_FRONTEND }}:${{ github.sha }}
            ${{ env.GHCR_REPOSITORY_FRONTEND }}:latest

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            # 1. Login to GHCR on the EC2 server
            echo $GITHUB_TOKEN | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin
            
            cd /opt/dokkan
            
            # 2. Set image names
            export BACKEND_IMAGE=${{ env.GHCR_REPOSITORY_BACKEND }}:latest
            export FRONTEND_IMAGE=${{ env.GHCR_REPOSITORY_FRONTEND }}:latest
            
            # 3. Pull and Start
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            
            # 4. Cleanup and Migrations
            docker compose -f docker-compose.prod.yml exec -T backend npx prisma migrate deploy
            docker image prune -f

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            echo $GITHUB_TOKEN | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin
            cd /opt/dokkan
            export BACKEND_IMAGE=${{ env.GHCR_REPOSITORY_BACKEND }}:${{ github.event.before }}
            export FRONTEND_IMAGE=${{ env.GHCR_REPOSITORY_FRONTEND }}:${{ github.event.before }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
