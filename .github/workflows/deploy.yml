name: Deploy

on:
  push:
    branches: ["master"]

permissions:
  contents: read
  packages: write

env:
  GHCR_REPOSITORY_BACKEND: ghcr.io/${{ github.repository_owner }}/dokkan-backend
  GHCR_REPOSITORY_FRONTEND: ghcr.io/${{ github.repository_owner }}/dokkan-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_REPOSITORY_BACKEND }}:${{ github.sha }}
            ${{ env.GHCR_REPOSITORY_BACKEND }}:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_REPOSITORY_FRONTEND }}:${{ github.sha }}
            ${{ env.GHCR_REPOSITORY_FRONTEND }}:latest

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          script: |
            cd /opt/dokkan
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml exec -T backend npx prisma migrate deploy
            docker image prune -f
