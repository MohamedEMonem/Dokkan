services:
  backend:
    image: ${BACKEND_IMAGE:-dokkan-backend:latest}
    build:
      context: ./Backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-dokkan-frontend:latest}
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_SERVER_DEV_API_URL: ${VITE_SERVER_DEV_API_URL}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
