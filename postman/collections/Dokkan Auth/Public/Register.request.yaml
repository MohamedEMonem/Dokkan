$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "test@example.com",
      "password": "Pass1234!",
      "name": "Test User",
      "role":"Customer"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
          const json = pm.response.json();
          pm.collectionVariables.set('token', json.data.token);
          pm.test('Register success', () => pm.expect(json.success).to.be.true);
      }
    language: text/javascript
order: 1000
