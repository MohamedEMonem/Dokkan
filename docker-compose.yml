version: '3.8'

services:
  # -----------------------------
  # PostgreSQL (Database)
  # -----------------------------
  postgres:
    image: postgres:16-alpine
    container_name: nx_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-my_app_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nx_network
    restart: always

  # -----------------------------
  # Redis (Cache/Queue)
  # -----------------------------
  redis:
    image: redis:alpine
    container_name: nx_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nx_network
    restart: always

  # -----------------------------
  # Meilisearch (Search Engine)
  # -----------------------------
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: nx_meilisearch
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-masterKey}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili_data:/meili_data
    networks:
      - nx_network
    restart: always

  # -----------------------------
  # MinIO (S3 Compatible Storage)
  # -----------------------------
  minio:
    image: minio/minio
    container_name: nx_minio
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Console Port
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    # MinIO requires a specific command to start the server and define the console port
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - nx_network
    restart: always

  # -----------------------------
  # NestJS Backend API
  # -----------------------------
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: nx_api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-root}@postgres:5432/${POSTGRES_DB:-my_app_db}
      - REDIS_URL=redis://redis:6379
      - MEILISEARCH_URL=http://meilisearch:7700
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      - postgres
      - redis
      - meilisearch
      - minio
    networks:
      - nx_network
    restart: unless-stopped

  # -----------------------------
  # React Frontend Application
  # -----------------------------
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: nx_web
    ports:
      - "4200:4200"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - api
    networks:
      - nx_network
    restart: unless-stopped

# -----------------------------
# Volumes & Networks
# -----------------------------
volumes:
  postgres_data:
  redis_data:
  meili_data:
  minio_data:

networks:
  nx_network:
    driver: bridge