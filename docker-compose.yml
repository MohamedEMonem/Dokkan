version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: nx_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nx_network
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: nx_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    networks:
      - nx_network

  redis:
    image: redis:alpine
    container_name: nx_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nx_network
    restart: always

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: nx_meilisearch
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    networks:
      - nx_network
    restart: always

  minio:
    image: minio/minio
    container_name: nx_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - nx_network
    restart: always

volumes:
  postgres_data:
  redis_data:
  meili_data:
  minio_data:

networks:
  nx_network:
    driver: bridge
